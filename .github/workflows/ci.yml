name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Quality gate: types, lint and tests ─────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # ─── Supply chain: fail on high/critical advisories in shipped dependencies ─
  # Transitive dependencies are pinned to patched versions with `pnpm.overrides` in package.json.
  # Two `image-size` advisories are ignored on purpose (`pnpm.auditConfig`): it is Metro's build-time
  # image reader (asset sizes), fed only our own repo files, and image-size 2.x breaks Metro (it
  # expects the 1.x API). Drop the ignore when Expo/Metro move to a patched image-size.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  # ─── Secrets: scan the whole history ─────────────────────────────────────
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license on org repos; the CLI image is free.
      - name: Scan history with gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --verbose
